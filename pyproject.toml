[project]
name = "srkit"
version = "0.1.0"
description = "Supreme Ruler 2030 모드 / 한글화 제작 도구"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
srkit = "srkit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "capstone>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
