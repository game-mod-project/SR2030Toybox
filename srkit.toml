# srkit 로컬 설정. 환경 변수 SR2030_GAME_DIR 가 있으면 game_dir 보다 우선한다.
game_dir = 'E:\SteamLibrary\steamapps\common\Supreme Ruler 2030'

[korean]
# 번역 원문으로 쓰는 언어 폴더와 새로 만들 언어 폴더
source_lang = "LOCALEN"
target_lang = "LOCALKO"
# 게임 옵션의 언어 목록에 표시할 이름 (다른 언어 글꼴로도 보여야 하므로 ASCII)
display_name = "Korean"
# 한글 글리프를 뽑을 글꼴 (가변 글꼴이면 weight 축 사용). 배포 시 라이선스 확인 필요 — docs/04 참고
hangul_font = 'C:\Windows\Fonts\NotoSansKR-VF.ttf'
hangul_weight_regular = 400
hangul_weight_bold = 700
